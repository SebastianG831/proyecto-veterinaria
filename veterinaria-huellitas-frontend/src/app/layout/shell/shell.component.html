<div class="shell">
  <aside class="sidebar">
    <div class="side-brand">
      <svg class="paw" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="5" stroke="#20223B" stroke-width="2"/>
        <circle cx="27" cy="10" r="5" stroke="#20223B" stroke-width="2"/>
        <circle cx="39" cy="16" r="5" stroke="#20223B" stroke-width="2"/>
        <path d="M17 27c0-6 5-9 10-9s10 3 10 9-4 12-10 12-10-6-10-12z" stroke="#20223B" stroke-width="2"/>
      </svg>
      <div class="brand-name">CLÍNICA<br>HUELLITAS</div>
    </div>

    <nav class="side-nav">
      @for (item of items; track item.path) {
        <a class="nav-link" [routerLink]="item.path" routerLinkActive="active" [title]="item.label">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            @switch (item.icon) {
              @case ('home') { <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/> }
              @case ('paw') {
                <circle cx="6.5" cy="10" r="1.8"/><circle cx="10.5" cy="6" r="1.8"/>
                <circle cx="15.5" cy="6" r="1.8"/><circle cx="19" cy="10" r="1.8"/>
                <path d="M8 17c0-3 2.2-4.5 4-4.5s4 1.5 4 4.5c0 2-1.6 3-4 3s-4-1-4-3z"/>
              }
              @case ('calendar') { <rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/> }
              @case ('plus') { <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/> }
              @case ('services') { <path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/> }
              @case ('list') { <path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/> }
              @case ('users') {
                <circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/>
                <path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.3c2 .8 3.5 2.7 3.5 5.700"/>
              }
            }
          </svg>
          <span class="nav-text">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="side-user">
      <div class="avatar">{{ inicial }}</div>
      <div class="user-info">
        <div class="user-name">{{ nombre }}</div>
        <div class="user-role">{{ rolEtiqueta }}</div>
      </div>
      <button class="logout" type="button" (click)="cerrarSesion()" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>
        </svg>
      </button>
    </div>
  </aside>

  <main class="content">
    <img class="content-blob" src="images/blob-br.png" alt="">
    <div class="content-inner">
      <router-outlet />
    </div>
  </main>
</div>
